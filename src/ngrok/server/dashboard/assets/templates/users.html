{{define "page_users"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户管理 · ngrokd 管理后台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{{template "nav" .}}
<main class="main">
  <div class="page-head"><h1>用户管理</h1></div>

  <div class="card">
    <table class="tbl">
      <thead><tr><th>用户名</th><th>角色</th><th>名下隧道</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody>
      {{range .Users}}
        <tr>
          <td><b>{{.Username}}</b>{{if eq .Username $.User.Username}} <span class="chip">我</span>{{end}}</td>
          <td>
            <select onchange="setUserRole('{{.ID}}', this.value)">
              <option value="admin" {{if eq .Role "admin"}}selected{{end}}>管理员</option>
              <option value="user" {{if eq .Role "user"}}selected{{end}}>普通用户</option>
            </select>
          </td>
          <td class="muted">{{index $.TunnelCounts .Username}}</td>
          <td class="muted">{{fmtTime .CreatedAt}}</td>
          <td>
            <a class="mini" onclick="resetUserPwd('{{.Username}}')">重置密码</a>
            <a class="mini danger" onclick="delUser('{{.Username}}')">删除</a>
          </td>
        </tr>
      {{end}}
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-title">新建用户</div>
    <form class="inline-form" onsubmit="return createUser(this)">
      <input name="username" placeholder="用户名" required>
      <input name="password" type="password" placeholder="密码 (至少6位)" required minlength="6">
      <select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select>
      <button class="btn btn-primary" type="submit">创建</button>
    </form>
  </div>
</main>

<div id="toast" class="toast hidden"></div>
<script>window.PAGE={role:"admin"};</script>
<script src="/static/app.js"></script>
</body>
</html>{{end}}
